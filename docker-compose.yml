services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: order-audit-api:1.0.0
    container_name: order-audit-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # 容器内报告 JSON 持久化目录（对应下方命名卷）
      DATA_DIR: /data
    volumes:
      - assess-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  assess-data:
    name: order-audit-data
